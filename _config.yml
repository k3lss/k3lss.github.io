# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Celia Merino León, PhD student
email: celmer@ucm.es
description: >- # this means to ignore newlines until "baseurl:"
  Personal website of Celia Merino León, PhD student in Astrophysics
  at the Universidad Complutense de Madrid.
url: "https://k3lss.github.io"
baseurl: ""
og_image: "/assets/images/share-card.jpg"
og_image_alt: "Celia Merino León, PhD student in Astrophysics at the Universidad Complutense de Madrid"
github_username: k3lss
minimal_mistakes_skin: ["dark"]
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Celia Merino"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "PhD student in Astrophysics<br>Dept. de Física de la Tierra y Astrofísica, Universidad Complutense de Madrid<br>Member of [GUAIX](https://guaix.ucm.es/)"
  location: "Madrid, Spain"
  email: celmer@ucm.es
  github: "k3lss"
  links:
    - label: "CV"
      icon: "far fa-fw fa-file-pdf"
      url: "/assets/files/CV.pdf"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=ZoPEG8EAAAAJ&hl=es"
    - label: "ORCiD"
      icon: "fab fa-brands fa-orcid"
      url: "https://orcid.org/0009-0000-8796-271X"
    - label: "NASA ADS"
      icon: "ai ai-fw ai-ads"
      url: "https://ui.adsabs.harvard.edu/search/q=orcid%3A0009-0000-8796-271X&sort=date%20desc"
    - label: "arXiv"
      icon: "ai ai-fw ai-arxiv"
      url: "https://arxiv.org/a/merino_c_1"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/celia-merino-leon"
    
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/k3lss"
    - label: "Linkedin"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/celia-merino-leon"
    - label: "Google Scholar"
      icon: "fab fa-fw fa-google-scholar"
      url: "https://scholar.google.com/citations?user=ZoPEG8EAAAAJ&hl=es"
    - label: "ORCiD"
      icon: "fab fa-brands fa-orcid"
      url: "https://orcid.org/0009-0000-8796-271X"
    - label: "NASA ADS"
      icon: "ai ai-fw ai-ads"
      url: "https://ui.adsabs.harvard.edu/search/q=orcid%3A0009-0000-8796-271X&sort=date%20desc"
    - label: "arXiv"
      icon: "ai ai-fw ai-arxiv"
      url: "https://arxiv.org/a/merino_c_1"

defaults:
  # _posts (used as the News section)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: true
      related: false
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
